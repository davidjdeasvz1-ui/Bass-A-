<title>Dennis Bass Guide</title>
<style>
:root{--bg:#0f1410;--card:#18221a;--g:#4caf50;--tx:#e8efe8;--mu:#9aa89c;--ln:#33463a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
#app{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 12px}h2{font-size:18px}h3{font-size:15px;margin:16px 0 6px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.sm{font-size:12px;color:var(--mu)}.g{color:#69f0ae}
button,select,input:not([type=range]):not([type=checkbox]){font:inherit;color:var(--tx);background:#223024;border:1px solid var(--ln);border-radius:8px;padding:9px}
button{cursor:pointer}
input[type=number],select{width:100%}
input[type=range]{width:100%;accent-color:var(--g)}
label{display:block;margin-top:10px;font-size:14px}
.pri,.on{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}
.wide{width:100%;margin-top:18px;padding:14px}
.bk{margin-bottom:6px}
.tabs,.seg,.chips,.btns,.hd{display:flex;gap:6px;align-items:center}
.tabs{overflow-x:auto;padding-bottom:8px}.tabs button{white-space:nowrap;border-radius:20px}
.seg button{flex:1}.chips{flex-wrap:wrap;margin:6px 0}
.chips span{background:#223024;border-radius:14px;padding:4px 10px;font-size:13px}
.btns{margin-top:18px}.btns button{flex:1;padding:13px}
.hd{justify-content:space-between}
.ban{background:rgba(76,175,80,.15);border-radius:8px;padding:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.ban.warn{background:rgba(255,152,0,.2)}.ban button{padding:2px 8px}
.row{display:flex;justify-content:space-between;padding:12px 8px;border-bottom:1px solid var(--ln);cursor:pointer}
.row.on{background:rgba(76,175,80,.25)!important;color:var(--tx)!important}
.lure{display:grid;grid-template-columns:1fr 1fr 60px auto;gap:6px;margin:6px 0}
.lure input,.lure select{min-width:0;width:100%}
.del{margin-top:8px;font-size:12px;padding:4px 10px;color:#ff8a80}
.oExcellent{color:#69f0ae}.oGood{color:#9ccc65}.oFair{color:#ffca28}.oTough{color:#ffab40}

return[0,1,2,3,4].map(i=>{const dt=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i,12);return{dt,moon:moon(dt),trend:'Steady',hi:74,avg:29.92,hours:T.map((t,k)=>({h:5+k*2,t,w:W[k],p:29.92}))}})}
const rd=()=>{if(view=='home'||view=='lake')draw()};
async function load(i,force){const l=lakes[i],o=F[l.n]||(F[l.n]={});if(o.busy||(o.days&&!force))return;o.busy=1;rd();
try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${l.la}&longitude=${l.lo}&hourly=temperature_2m,wind_speed_10m,surface_pressure&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=5`);
if(!r.ok)throw 0;const j=await r.json(),h=j.hourly,D={};
h.time.forEach((t,k)=>{const T=h.temperature_2m[k],W=h.wind_speed_10m[k],P=h.surface_pressure[k];if(T==null||W==null||P==null)return;
const key=t.slice(0,10),H=+t.slice(11,13),p=P*.02953,d=D[key]=D[key]||{date:key,hours:[],ps:[]};d.ps.push(p);
if(H>=5&&H<=19&&H%2)d.hours.push({h:H,t:T,w:W,p})});
const days=Object.values(D).filter(d=>d.hours.length).map(d=>{const dt=new Date(d.date+'T12:00:00'),ch=d.ps[d.ps.length-1]-d.ps[0];
return{dt,hours:d.hours,moon:moon(dt),trend:ch>.05?'Rising':ch<-.05?'Falling':'Steady',hi:Math.max(...d.hours.map(x=>x.t)),avg:d.hours.reduce((a,x)=>a+x.p,0)/d.hours.length}});
if(!days.length)throw 0;o.days=days;o.live=1;o.at=new Date()}
catch(e){if(!o.days){o.days=mock();o.live=0}}
o.busy=0;rd()}
const refreshAll=()=>lakes.forEach((_,i)=>load(i,1));

const LH={'Soft Plastics':'Senkos, worms, craws; flipping and finesse','Crankbaits':'Squarebills and lipless; deep divers when warm','Jigs':'Football and flipping jigs, slow near cover','Spinner':'Spinnerbaits and chatterbaits; great in wind or stain','Topwater':'Frogs, buzzbaits, poppers; low light and calm','Swimbaits':'Soft and hard swimbaits along grass and points'};
const tent=(x,lo,pk,hi)=>x<=lo||x>=hi?0:x<pk?(x-lo)/(pk-lo):(hi-x)/(hi-pk);
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function advise(a){const w=a.water,nt=[];let s=50;
const R={'Soft Plastics':50+20*tent(w,45,70,95),'Crankbaits':40+35*tent(w,42,58,80),'Jigs':45+25*tent(w,35,48,68)+20*tent(w,70,85,95),'Spinner':40+30*tent(w,50,65,82),'Topwater':30+45*tent(w,60,76,92),'Swimbaits':35+30*tent(w,45,58,75)};
if(w<50){nt.push('Cold water: fish slowly near deeper structure.');s-=10}
else if(w<60)nt.push('Pre-spawn: fish stage on points and creek channels, moving shallow on warm afternoons.');
else if(w<=70){nt.push('Spawn/post-spawn: target shallow cover, docks and grass edges.');s+=10}
else if(w<=80)nt.push('Summer: topwater early and late, deeper structure or shade midday.');
else{nt.push('Hot water: fish deep or in shade; go early, late or at night.');s-=5}
R.Spinner+=Math.min(a.wind,15)*1.5;R.Crankbaits+=Math.min(a.wind,12);R.Swimbaits+=Math.min(a.wind,10)*.5;
R.Topwater-=Math.min(a.wind,20)*1.5;R['Soft Plastics']-=Math.max(0,a.wind-12)*1.5;
if(a.wind>8&&w>=50&&w<=80){nt.push('Wind over 8 mph: work wind-blown banks with moving baits.');s+=5}
if(a.wind>18){nt.push('Strong wind: be careful on the water.');s-=10}
if(a.trend=='Falling'){s+=15;R.Crankbaits+=10;R.Spinner+=10;R.Topwater+=8;R.Swimbaits+=8;nt.push('Falling pressure often triggers feeding: use faster reaction baits.')}
if(a.trend=='Rising'){s-=5;R['Soft Plastics']+=12;R.Jigs+=10;R.Crankbaits-=5;R.Topwater-=8;nt.push('Rising pressure after a front: slow down and downsize.')}
if(a.air<w-15){s-=10;R.Jigs+=10;R['Soft Plastics']+=10;R.Topwater-=15;R.Crankbaits-=5;nt.push('Air is much colder than the water: expect a slow bite.')}
if(a.air>80)R.Topwater+=5;
if(/^(New|Full)/.test(a.moon)){s+=10;nt.push(a.moon+': stronger solunar periods, focus on dawn and dusk.')}
if(a.clar=='Muddy'){R.Spinner+=15;R.Crankbaits+=10;R.Topwater-=5;R.Swimbaits-=10;nt.push('Muddy water: use rattles/vibration and dark or bright solid colors.')}
else if(a.clar=='Stained'){R.Spinner+=8;R.Crankbaits+=5}
else{R.Swimbaits+=10;R['Soft Plastics']+=5;R.Spinner-=5;R.Jigs+=3;nt.push('Clear water: natural colors and lighter line.')}
const rs=Object.entries(R).map(([k,v])=>[k,Math.max(1,v)]).sort((x,y)=>y[1]-x[1]),mx=rs[0][1];
const rk=rs.map(([k,v])=>[k,Math.max(6,Math.round(100*v/mx))]);
const CS={Clear:{'Green Pumpkin':8,'Watermelon':7,'Shad':7,'Brown':4,'White':3,'Black/Blue':1,'Chartreuse':1,'Red':2},
Stained:{'Black/Blue':6,'Chartreuse':6,'Green Pumpkin':6,'Brown':5,'Watermelon':4,'White':4,'Shad':3,'Red':3},
Muddy:{'Black/Blue':8,'Chartreuse':7,'White':6,'Red':5,'Brown':3,'Green Pumpkin':2,'Watermelon':1,'Shad':2}}[a.clar];
const cold=cl((62-w)/15,0,1),warm=cl((w-58)/15,0,1);
CS.Brown+=3*cold;CS.Red+=3*cold;CS['Black/Blue']+=2*cold;CS.Shad+=2*warm;CS.White+=warm;
const co=Object.entries(CS).sort((x,y)=>y[1]-x[1]).slice(0,4).map(x=>x[0]);
s=cl(s,0,100);
return{rk,co,nt,s,o:s>=70?'Excellent':s>=55?'Good':s>=40?'Fair':'Tough'}}
const LT=['Soft Plastics','Crankbaits','Jigs','Spinner','Topwater','Swimbaits'];
const LC=['Green Pumpkin','Black/Blue','Brown','White','Chartreuse','Shad','Red','Watermelon'];
const sel=(opts,v,ph,on)=>`<select onchange="${on}"><option value="">${ph}</option>${opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
const seg=(opts,cur,t)=>`<div class="seg">${opts.map(o=>`<button class="${o==cur?'on':''}" onclick="${t}='${o}';draw()">${o}</button>`).join('')}</div>`;

function home(){return`<div class="hero"><h1>Dennis Bass Guide</h1></div><button onclick="refreshAll()">⟳ Refresh forecasts</button><div style="height:10px"></div>`+
lakes.map((l,i)=>{const o=F[l.n]||{},d=o.days&&o.days[0];
return`<div class="card" onclick="openLake(${i})"><b>${esc(l.n)}</b><div class="sm">Water ${Math.round(l.w)}°F · ${l.c}</div><div class="sm">${o.busy&&!d?'Loading…':d?(o.live?'':'Sample · ')+'High '+Math.round(d.hi)+'°F · Baro '+d.trend:'—'}</div></div>`}).join('')}

const cur=()=>{const l=lakes[S.i],o=F[l.n],di=Math.min(S.day,o.days.length-1);return{l,o,d:o.days[di],di}};
function hidx(d,di){if(S.hour>=0&&S.hour<d.hours.length)return S.hour;
if(di==0){const n=new Date().getHours();let b=0;d.hours.forEach((x,k)=>{if(Math.abs(x.h-n)<Math.abs(d.hours[b].h-n))b=k});return b}
return Math.min(3,d.hours.length-1)}
function openLake(i){S={day:0,hour:-1,i};view='lake';load(i);draw();scrollTo(0,0)}
function lake(){const l=lakes[S.i],o=F[l.n]||{};let h=`<button class="bk" onclick="go('home')">← Waterways</button><h1>${esc(l.n)}</h1>`;
if(!o.days)return h+'<p>Loading forecast…</p>';
const{d,di}=cur(),hi=hidx(d,di);
h+=`<div class="tabs">${o.days.map((e,k)=>`<button class="${k==di?'on':''}" onclick="S.day=${k};S.hour=-1;draw()">${dl(e,k)}</button>`).join('')}</div>`;
h+=`<div class="ban ${o.live?'':'warn'}"><span>${o.live?'Live forecast · updated '+tm(o.at):'Offline: sample data, not a real forecast.'}</span><button onclick="load(${S.i},1)">⟳</button></div>`;
h+=`<div class="chips"><span>${d.avg.toFixed(2)} inHg · ${d.trend}</span><span>${d.moon}</span></div>`;
h+=`<div class="card"><b>Water <span id="wl">${Math.round(l.w)}</span>°F · ${l.c}</b><div class="sm">Not in weather data. Set it from what you see on the water.</div><input type="range" min="40" max="90" value="${l.w}" oninput="lakes[${S.i}].w=+this.value;$('#wl').textContent=this.value;sl()">${seg(CL,l.c,'lakes['+S.i+'].c').replace(/draw\(\)/g,'sl();draw()')}</div>`;
h+=`<h3>Hourly (tap a row to use it)</h3>`+d.hours.map((e,k)=>`<div class="row ${k==hi?'on':''}" onclick="S.hour=${k};draw()"><b>${hr(e.h)}</b><span>${Math.round(e.t)}°F</span><span>${Math.round(e.w)} mph</span></div>`).join('');
return h+`<div class="btns"><button onclick="openAdv(${hi})">Lure Advisor</button><button class="pri" onclick="openLog(${hi})">Record Catch</button></div>`}

function openAdv(hi){const{l,d}=cur(),x=d.hours[hi];A={air:Math.round(x.t),wind:Math.round(x.w),water:l.w,clar:l.c,trend:d.trend,moon:d.moon};view='adv';draw();scrollTo(0,0)}
function hist(){const ms=catches.filter(c=>Math.abs(c.water-A.water)<=3&&c.clar==A.clar),h='<h3>Your catch history</h3>';
if(!ms.length)return h+`<p class="sm">No logged catches yet with water near ${Math.round(A.water)}°F and ${A.clar} clarity.</p>`;
const tl={};ms.forEach(c=>c.lures.forEach(u=>{const k=(u.c+' '+u.t).trim();tl[k]=(tl[k]||0)+u.n}));
const top=Object.entries(tl).sort((a,b)=>b[1]-a[1]).slice(0,5);
return h+`<p class="sm">${ms.length} logged trip${ms.length>1?'s':''} within 3°F of ${Math.round(A.water)}°F water, ${A.clar} clarity${ms.length<3?' (small sample, so treat it lightly)':''}. Fish caught by lure:</p><ul>${top.map(([k,v])=>`<li>${esc(k)}: ${v}</li>`).join('')}</ul>`}
function advR(){const r=advise(A);return`<h2>Bite outlook: <span class="o${r.o}">${r.o} (${r.s})</span></h2><p class="sm">A rule-of-thumb estimate, not a guarantee.</p><h3>Lure ranking</h3>${r.rk.map(([k,v],i)=>`<div style="margin:8px 0"><b>${i+1}. ${k}</b><div class="sm">${LH[k]}</div><div style="background:#223024;border-radius:4px;height:8px"><div style="width:${v}%;height:8px;border-radius:4px;background:var(--g)"></div></div></div>`).join('')}<h3>Colors</h3><div class="chips">${r.co.map(c=>`<span>${c}</span>`).join('')}</div><h3>Why</h3><ul class="sm">${r.nt.map(t=>`<li>${t}</li>`).join('')}</ul>`+hist()}
const advRes=()=>{$('#res').innerHTML=advR()};
const adv=()=>`<button class="bk" onclick="view='lake';draw()">← Back</button><h1>Lure Advisor</h1>`+
[['air','Air °F',30,100],['wind','Wind mph',0,30],['water','Water °F',40,90]].map(([k,n,a,b])=>`<label>${n}: <b id="v${k}">${Math.round(A[k])}</b></label><input type="range" min="${a}" max="${b}" value="${A[k]}" oninput="A.${k}=+this.value;$('#v${k}').textContent=this.value;advRes()">`).join('')+
`<label>Clarity</label>${seg(CL,A.clar,'A.clar')}<label>Barometer</label>${seg(['Falling','Steady','Rising'],A.trend,'A.trend')}<div id="res">${advR()}</div>`;

function fillL(i){const l=lakes[i],o=F[l.n];L.i=i;L.water=l.w;L.clar=l.c;L.moon=moon(new Date());L.air=L.wind=L.pres='';
if(o&&o.days){const d=o.days[Math.min(L.di,o.days.length-1)],x=d.hours[Math.min(L.hi,d.hours.length-1)];L.moon=d.moon;
if(x){L.air=Math.round(x.t);L.wind=Math.round(x.w);L.pres=x.p.toFixed(2)}}}
function openLog(hi){const{di}=cur();L={di,hi,lures:[{t:'',c:'',n:1}]};fillL(S.i);view='log';draw();scrollTo(0,0)}
const logf=()=>`<button class="bk" onclick="view='lake';draw()">← Back</button><h1>Log Catch</h1><label>Location</label><select onchange="fillL(+this.value);draw()">${lakes.map((l,i)=>`<option value="${i}" ${i==L.i?'selected':''}>${esc(l.n)}</option>`).join('')}</select>`+
[['air','Air °F'],['wind','Wind mph'],['water','Water °F'],['pres','Pressure inHg']].map(([k,n])=>`<label>${n}</label><input type="number" step="any" inputmode="decimal" value="${L[k]}" oninput="L.${k}=this.value">`).join('')+
`<label>Clarity</label>${seg(CL,L.clar,'L.clar')}<p class="sm">Moon: ${L.moon}</p><div class="hd"><h3>Lures</h3><button onclick="L.lures.push({t:'',c:'',n:1});draw()">+ Add lure</button></div>`+
L.lures.map((u,k)=>`<div class="lure">${sel(LT,u.t,'Lure…','L.lures['+k+'].t=this.value')}${sel(LC,u.c,'Color…','L.lures['+k+'].c=this.value')}<input type="number" min="1" value="${u.n}" oninput="L.lures[${k}].n=Math.max(1,+this.value||1)">${L.lures.length>1?`<button onclick="L.lures.splice(${k},1);draw()">✕</button>`:'<span></span>'}</div>`).join('')+
`<button class="pri wide" onclick="saveC()">Save to Archives</button>`;
function saveC(){const lu=L.lures.filter(u=>u.t.trim()).map(u=>({t:u.t.trim(),c:u.c.trim(),n:u.n}));
if(!lu.length)return alert('Pick at least one lure.');
catches.unshift({id:Date.now(),loc:lakes[L.i].n,date:new Date().toISOString(),air:+L.air||0,wind:+L.wind||0,water:+L.water||0,clar:L.clar,pres:+L.pres||0,moon:L.moon,lures:lu});
sv('vbg_catches',catches);go('arch')}

function archList(){const ls=G.on?catches.filter(c=>Math.abs(c.water-G.t)<=3&&c.clar==G.c):catches,tl={};
ls.forEach(c=>c.lures.forEach(u=>{const k=(u.c+' '+u.t).trim();tl[k]=(tl[k]||0)+u.n}));
const top=Object.entries(tl).sort((a,b)=>b[1]-a[1]).slice(0,3),tot=ls.reduce((s,c)=>s+c.lures.reduce((a,u)=>a+u.n,0),0);
return(top.length?`<p class="sm"><b>Top producers (${tot} fish logged)</b></p><div class="chips">${top.map(([k,v])=>`<span>${esc(k)} (${v})</span>`).join('')}</div>`:'')+
(ls.length?ls.map(c=>`<div class="card"><div class="hd"><b>${esc(c.loc)}</b><span class="sm">${new Date(c.date).toLocaleDateString()}</span></div><div class="sm g">Water ${Math.round(c.water)}°F · ${c.clar} · Air ${Math.round(c.air)}°F · Wind ${Math.round(c.wind)} mph · ${(+c.pres).toFixed(2)} inHg · ${esc(c.moon)}</div>${c.lures.map(u=>`<div>• ${u.n} caught: ${esc((u.c+' '+u.t).trim())}</div>`).join('')}<button class="del" onclick="delC(${c.id})">Delete</button></div>`).join(''):
`<p class="sm">${catches.length?'No catches match those conditions.':'No catches logged yet. Open a lake and tap Record Catch.'}</p>`)}
const arch=()=>`<h1>Catch Archives</h1><label><input type="checkbox" ${G.on?'checked':''} onchange="G.on=this.checked;draw()"> Match conditions</label>`+
(G.on?`${seg(CL,G.c,'G.c')}<label>Target water °F (±3)</label><input type="number" value="${G.t}" oninput="G.t=+this.value||0;$('#al').innerHTML=archList()">`:'')+
`<div id="al">${archList()}</div><div class="btns"><button onclick="exp()">Export backup</button><button onclick="$('#imp').click()">Import backup</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])">`;
function delC(id){if(confirm('Delete this catch record?')){catches=catches.filter(c=>c.id!=id);sv('vbg_catches',catches);draw()}}
function exp(){const b=new Blob([JSON.stringify({catches},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bass-backup.json';a.click()}
function imp(f){if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.catches))throw 0;const ids=new Set(catches.map(c=>c.id));
j.catches.forEach(c=>{if(c&&c.id&&Array.isArray(c.lures)&&!ids.has(c.id))catches.push(c)});catches.sort((a,b)=>b.id-a.id);sv('vbg_catches',catches);draw();alert('Backup imported.')}catch(e){alert('That file is not a valid backup.')}})}

function draw(){$('#app').innerHTML={home,lake,adv,log:logf,arch}[view]();$('#n1').className=view=='arch'?'':'on';$('#n2').className=view=='arch'?'on':''}
function go(v){view=v;draw();scrollTo(0,0)}
draw();refreshAll();
</script></body></html>
